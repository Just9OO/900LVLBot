name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.
        **Never paste your bot token** (`DISCORD_TOKEN`) anywhere in this issue. If you already did, reset it in the Discord Developer Portal.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead? Screenshots are welcome.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command or feature
      placeholder: "/config, /custom-theme, a level-up card…"
  - type: input
    id: version
    attributes:
      label: Bot version
      description: The `version` in package.json
      placeholder: 2.0.0
  - type: dropdown
    id: host
    attributes:
      label: Where are you running it?
      options: [Windows, macOS, Linux / VPS, Termux (Android), Docker, Railway, Render, Other]
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: v20.18.0
  - type: textarea
    id: logs
    attributes:
      label: Console output
      description: Copy any errors from the console. Remove tokens and IDs you don't want to share.
      render: shell
